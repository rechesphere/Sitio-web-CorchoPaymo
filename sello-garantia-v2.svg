<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 160">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF73" />
      <stop offset="30%" stop-color="#F2C94C" />
      <stop offset="70%" stop-color="#F2994A" />
      <stop offset="100%" stop-color="#E87D1E" />
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B87333" />
      <stop offset="50%" stop-color="#F2C94C" />
      <stop offset="100%" stop-color="#B87333" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Ribbon -->
  <path d="M 40 100 L 15 150 L 40 135 L 65 150 Z" fill="url(#goldRibbon)" filter="url(#dropShadow)" />
  <!-- Right Ribbon -->
  <path d="M 100 100 L 75 150 L 100 135 L 125 150 Z" fill="url(#goldRibbon)" filter="url(#dropShadow)" />

  <!-- Main Circular Badge -->
  <g filter="url(#dropShadow)">
    <circle cx="70" cy="65" r="58" fill="#ffffff" />
    <circle cx="70" cy="65" r="54" fill="url(#goldGradient)" />
    <circle cx="70" cy="65" r="46" fill="url(#blueGradient)" />
    
    <!-- Decorative Inner Rings -->
    <circle cx="70" cy="65" r="41" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="70" cy="65" r="35" fill="none" stroke="url(#goldGradient)" stroke-width="0.5" opacity="0.6" />
    
    <!-- Text Elements -->
    <text x="70" y="58" font-family="'Outfit', sans-serif" font-weight="800" font-size="44" fill="url(#goldGradient)" text-anchor="middle" filter="url(#glow)">15</text>
    <text x="70" y="78" font-family="'Poppins', sans-serif" font-weight="700" font-size="15" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">AÑOS</text>
    <text x="70" y="94" font-family="'Poppins', sans-serif" font-weight="600" font-size="8" fill="#94a3b8" text-anchor="middle" letter-spacing="2">GARANTÍA</text>
  </g>
</svg>
